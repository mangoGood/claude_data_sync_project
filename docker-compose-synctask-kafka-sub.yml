# 订阅任务专用的「下游 Kafka」——与 docker-compose-synctask.yml 里的 synctask-kafka(29092) 完全隔离。
#
# 为什么要单独一套：29092 那套是控制面（backend↔agent 的任务下发/状态上报）。订阅任务把 CDC 数据
# 写进去，会与控制面 topic 混在一起，压测时几十万条 CDC 消息还会挤占控制面、让任务状态上报变慢甚至丢失，
# 测试结论也就不可信了。这里另起 zk+broker（独立网段 192.168.151.0/24），宿主监听 39092。
#
# 起停：
#   docker compose -f docker-compose-synctask-kafka-sub.yml up -d
#   docker compose -f docker-compose-synctask-kafka-sub.yml down
services:
  synctask-zk-sub:
    image: docker.1ms.run/confluentinc/cp-zookeeper:7.3.0
    container_name: synctask-zk-sub
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      synctask-sub-net:
        ipv4_address: 192.168.151.11

  synctask-kafka-sub:
    image: docker.1ms.run/confluentinc/cp-kafka:7.3.0
    container_name: synctask-kafka-sub
    depends_on:
      - synctask-zk-sub
    ports:
      - "39092:39092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: synctask-zk-sub:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:39092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://synctask-kafka-sub:9092,PLAINTEXT_HOST://localhost:39092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # 压测会灌几十万条 CDC 消息，默认 1G/segment 够用；保留 2 小时足够单轮用例回放
      KAFKA_LOG_RETENTION_HOURS: 2
      KAFKA_NUM_PARTITIONS: 1
    networks:
      synctask-sub-net:
        ipv4_address: 192.168.151.12

  # subscribe.format=AVRO 用的 Schema Registry。
  #
  # 用 Apicurio 而不是 Confluent 自家的镜像，是**有意的**：Apicurio 提供一套
  # Confluent 兼容 API（/apis/ccompat/v7），拿它来验能同时回答两个问题——
  # 我们产出的 wire format 对不对、以及"Confluent 兼容"是不是只对 Confluent 自己成立。
  # 换一家实现照样跑通，才说明这个格式是通用的。（镜像也小得多。）
  synctask-schema-registry:
    image: docker.1ms.run/apicurio/apicurio-registry-mem:2.4.2.Final
    container_name: synctask-schema-registry
    depends_on:
      - synctask-kafka-sub
    ports:
      - "38081:8080"
    environment:
      QUARKUS_PROFILE: prod
      # 加列时自动注册新版本（我们的每个列字段都带 default:null，是向后兼容的加列）
      REGISTRY_AUTO_REGISTER_ARTIFACT: "true"
    networks:
      synctask-sub-net:
        ipv4_address: 192.168.151.13

networks:
  synctask-sub-net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.151.0/24
