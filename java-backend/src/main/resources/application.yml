# ============================================================
# Sync Task Backend 应用配置
# ============================================================
server:
  port: 38080
  # ============================================================
  # 后端 HTTPS
  #
  # 明文 HTTP 下 JWT 是可嗅探的——拿到 token 即等同登录，这是整个平台最直接的一处暴露。
  # 配了 BACKEND_TLS_KEYSTORE 就走 HTTPS；不配则保持明文（= 升级前行为）。
  # keystore 用 PKCS12，与平台其它地方的证书形态一致（test_scripts/ssl/gen_certs.sh 会生成）。
  # ============================================================
  ssl:
    enabled: ${BACKEND_TLS_ENABLED:false}
    key-store: ${BACKEND_TLS_KEYSTORE:}
    key-store-type: PKCS12
    key-store-password: ${BACKEND_TLS_KEYSTORE_PASSWORD:}
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    max-connections: 8192
    connection-timeout: 20000

spring:
  application:
    name: sync-task-backend

  # ============================================================
  # 主数据库（业务库，存储任务/用户/审计等元数据）
  # ============================================================
  datasource:
    # 元数据库连接。META_DB_SSL_MODE 缺省 DISABLED（= useSSL=false，历史行为）；
    # 设成 REQUIRED/VERIFY_CA/VERIFY_IDENTITY 即让后端到元数据库这一跳也走 TLS。
    # 直接给 DB_URL 时以 DB_URL 为准（运维可以自己写全参数）——注意 start.sh 会导出 DB_URL，
    # 所以实际部署路径下生效的是 start.sh 里那段按 META_DB_SSL_MODE 拼的逻辑（含信任库路径），
    # 下面这个默认值只在裸跑 java -jar 且没设 DB_URL 时才用得上。
    url: ${DB_URL:jdbc:mysql://localhost:33306/sync_task_db?sslMode=${META_DB_SSL_MODE:DISABLED}&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: backend-hikari-pool

  # ============================================================
  # Flyway（版本化 schema 迁移，取代 database.sql + ddl-auto:update 双轨制）
  # ============================================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  # ============================================================
  # JPA / Hibernate（schema 完全交给 Flyway 管理，这里只做一致性校验，不再自动改表）
  # ============================================================
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  # ============================================================
  # 文件上传（目前只有 TLS 证书这一处用到）
  #
  # 上限压得很低是刻意的：这个端点只接 PEM 文本，正常证书都是几 KB。放宽到几十 MB
  # 等于给一个已认证但越权的调用者一条免费的磁盘填充通道。单份文件的精确上限由
  # CertMaterial.MAX_PEM_BYTES(64KB) 在业务侧再判一次，报错能指出是哪一份。
  # ============================================================
  servlet:
    multipart:
      enabled: true
      max-file-size: 256KB
      max-request-size: 1MB

  # ============================================================
  # Kafka（任务状态回传 + 任务创建事件）
  # ============================================================
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        linger.ms: 1
    consumer:
      group-id: sync-task-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.info.headers: false
    listener:
      ack-mode: manual_immediate
    topics:
      task-created: sync-task-created
      task-status: sync-task-status

  # ============================================================
  # Spring Security 默认账号（仅用于 Actuator 端点，业务鉴权使用 JWT）
  # ============================================================
  security:
    user:
      name: admin
      password: admin

  # ============================================================
  # 异步任务线程池
  # ============================================================
  task:
    execution:
      pool:
        core-size: 5
        max-size: 10
        queue-capacity: 100
      thread-name-prefix: workflow-async-

# ============================================================
# JWT 鉴权配置
# ============================================================
jwt:
  # 不再内置默认密钥。生产必须通过 JWT_SECRET 环境变量注入；留空时后端启动生成随机密钥（仅供开发，
  # 重启后旧 token 失效并打印告警）。见 JwtTokenProvider。
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

# ============================================================
# 应用业务配置
# ============================================================
app:
  # 任务文件存储根目录（binlog/thl 临时文件）
  task:
    file-base-path: ${TASK_FILE_BASE_PATH:./files}
  # CORS 允许的源
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:38080,http://127.0.0.1:38080,http://localhost:3000}
  # 资源配额默认值（新用户默认配额）
  quota:
    default:
      max-tasks: 50
      max-concurrent-tasks: 5
      max-storage-mb: 10240
      api-rate-limit-per-min: 100
  # 告警通知默认配置
  alert:
    webhook-timeout-seconds: 5
    retry-notify-times: 3

# ============================================================
# TLS 证书物化目录
#
# 库里存的是 PEM 文本，而 JDBC 驱动要的是**文件路径**（MySQL 要 p12、PG 要 PEM+pk8），
# 所以按需转换一次并缓存在这里。目录与其中的文件权限都收到 0700/0600。
# 与 agent 侧各自物化各自的一份：两者可能根本不在同一台机器上。
# ============================================================
synctask:
  cert:
    dir: ${SYNCTASK_CERT_DIR:${user.dir}/certs}

# ============================================================
# 日志级别
# ============================================================
logging:
  level:
    com.synctask: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
